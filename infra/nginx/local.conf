# Local routing adapter only. Kubernetes deployment uses the real OpenFaaS Gateway.
server {
    listen 8080;
    client_max_body_size 64k;
    location /function/product-service/ { proxy_pass http://product-service:8080/; }
    location /function/order-service/ { proxy_pass http://order-service:8080/; }
    location /function/total-calculator/ { proxy_pass http://total-calculator:8080/; }
    location / { return 404; }
}

