apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lab03-data
spec:
  selector:
    app: lab03-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: lab03-data
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: lab03-postgres
  template:
    metadata:
      labels:
        app: lab03-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-bookworm
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab03-db-credentials
                  key: POSTGRES_PASSWORD
            - name: PRODUCT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab03-db-credentials
                  key: PRODUCT_DB_PASSWORD
            - name: ORDER_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lab03-db-credentials
                  key: ORDER_DB_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            exec:
              command: [sh, -c, "pg_isready -U postgres -d postgres"]
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d/01-init.sh
              subPath: 01-init.sh
            - name: init
              mountPath: /schemas
      volumes:
        - name: init
          configMap:
            name: postgres-init
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
