version: 1.0
provider:
  name: openfaas
  gateway: http://127.0.0.1:18080

functions:
  product-service:
    lang: python3-http-debian
    handler: ./.generated/product-service
    image: localhost:5000/lab03/product-service:1.0.0
    build_args:
      PYTHON_VERSION: "3.12"
    environment:
      DATABASE_SECRET: product-database-url
    secrets:
      - product-database-url
    labels:
      com.openfaas.scale.min: "1"
      com.openfaas.scale.max: "1"
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 192Mi
      cpu: 300m
  order-service:
    lang: python3-http-debian
    handler: ./.generated/order-service
    image: localhost:5000/lab03/order-service:1.0.0
    build_args:
      PYTHON_VERSION: "3.12"
    environment:
      DATABASE_SECRET: order-database-url
      GATEWAY_URL: http://gateway.openfaas:8080
    secrets:
      - order-database-url
    labels:
      com.openfaas.scale.min: "1"
      com.openfaas.scale.max: "1"
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 192Mi
      cpu: 300m
  total-calculator:
    lang: python3-http-debian
    handler: ./.generated/total-calculator
    image: localhost:5000/lab03/total-calculator:1.0.0
    build_args:
      PYTHON_VERSION: "3.12"
    labels:
      com.openfaas.scale.min: "1"
      com.openfaas.scale.max: "1"
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 128Mi
      cpu: 200m
